# Production stack for the SHARED EC2 box (HOA protocols 03 + 05), next to the other House of Apps
# projects. PostgreSQL runs as a host service on the box, not in this stack.
#
# Isolation:
#   - `name: benchbox` -> containers/networks are `benchbox_*`; nothing collides with other apps.
#   - The app publishes ONLY on 127.0.0.1 -> reachable by host nginx, never from the internet.
#
# Usage (full runbook: docs/DEPLOY.md). With a schema change, migrate FIRST, always with --build:
#   docker compose -f docker-compose.prod.yml run --rm --build migrate
#   docker compose -f docker-compose.prod.yml up -d --build app worker
name: benchbox

services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    # Loopback only, so only host nginx can reach it. The host port comes from APP_HOST_PORT in
    # .env (8080 and 8090–8093 belong to other apps); 8080 on the right is the in-container port.
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8094}:8080"
    # Reach the host's PostgreSQL: DATABASE_URL in .env points at host.docker.internal:5432.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The box is small and shared: cap this container's log files so they can't fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Scheduled jobs (deviation D5): trash auto-purge, tombstone compaction, expired-session cleanup.
  # Same image as the app, its own process; the API never runs jobs. No published port.
  worker:
    build:
      context: .
      target: runner
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-off schema migration — a DISCRETE step, never on container start (HOA protocol 04). Uses the
  # builder stage, which has the Prisma CLI (a dev dependency the slim runtime image doesn't ship).
  migrate:
    build:
      context: .
      target: builder
    env_file: .env
    command: npx prisma migrate deploy
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["tools"] # excluded from `up`; only started via `run`
