# LOCAL development only: a PostgreSQL 16 for the API to run against (HOA protocol 04 dev compose).
# Production has no database container — see docker-compose.prod.yml.
#
#   docker compose up -d db
#   DATABASE_URL=postgresql://benchbox:benchbox@localhost:5432/benchbox?schema=public  (in .env)
#   npm run prisma:migrate          # apply / create migrations
#   npm run dev
#
# Without Docker, any local PostgreSQL works the same way — only DATABASE_URL changes.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: benchbox
      POSTGRES_PASSWORD: benchbox
      POSTGRES_DB: benchbox
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchbox -d benchbox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
